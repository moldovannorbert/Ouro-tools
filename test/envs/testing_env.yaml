name: ouro-tools-testing
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.8
  - pip>=21.0
  # Core dependencies from requirements.txt
  - pysam>=0.19.0
  - numpy>=1.20.0
  - biopython>=1.79
  - pybedtools>=0.8.2
  # Testing frameworks
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  # Additional tools that might be useful for testing
  - pandas>=1.3.0
  - matplotlib>=3.5.0
  # Add pip-installable packages here if needed
  - pip:
    - pytest-xdist>=3.0.0  # For parallel testing
